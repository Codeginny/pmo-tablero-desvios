name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e '.[dev]'

      - name: Estilo (ruff)
        run: ruff check .

      - name: Tests con cobertura
        run: pytest --cov=pmo --cov-report=term-missing --cov-fail-under=85

      - name: El dataset del repo es el que genera la semilla 42
        run: |
          python -m pmo.generar_datos
          git diff --exit-code -- data/raw data/control

      - name: Pipeline completo
        run: python -m pmo.pipeline
